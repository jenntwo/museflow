<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MuseFlow — Project Progress</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0a0c10;
            color: #f3f5f7;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 60px 30px;
        }

        .eyebrow {
            color: #d7ff64;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 60px;
            margin: 12px 0;
        }

        .subtitle {
            color: #9099a5;
            font-size: 18px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background: #11151b;
            border: 1px solid #252b34;
            border-radius: 16px;
            padding: 25px;
        }

        .label {
            color: #8e98a5;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .percentage {
            font-size: 60px;
            font-weight: bold;
            margin-top: 10px;
        }

        .progress-bar {
            height: 10px;
            background: #252b34;
            border-radius: 20px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #d7ff64;
            width: 0;
            transition: width 0.5s ease;
        }

        .stats {
            display: flex;
            gap: 30px;
            margin-top: 25px;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
        }

        .current-task {
            font-size: 24px;
            font-weight: bold;
            margin-top: 12px;
        }

        .task-list {
            margin-top: 20px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 15px;

            padding: 16px 0;

            border-bottom: 1px solid #252b34;
        }

        .dot {
            width: 10px;
            height: 10px;

            border-radius: 50%;

            border: 1px solid #666;
        }

        .done .dot {
            background: #d7ff64;
            border-color: #d7ff64;
        }

        .active .dot {
            background: #76a9ff;
            border-color: #76a9ff;
        }

        .task-name {
            flex: 1;
        }

        .task-detail {
            color: #8993a0;
            font-size: 13px;
        }

        .status {
            color: #8993a0;

            font-size: 11px;

            text-transform: uppercase;
        }

        @media (max-width: 750px) {

            h1 {
                font-size: 42px;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <div class="eyebrow">
        MuseFlow / Engineering Dashboard
    </div>

    <h1>
        Project Progress
    </h1>

    <p class="subtitle">
        AI-Powered Museum Guide & Management Platform
    </p>


    <div class="dashboard">

        <div class="card">

            <div class="label">
                Overall Progress
            </div>

            <div
                class="percentage"
                id="percentage">
                0%
            </div>

            <div class="progress-bar">

                <div
                    class="progress-fill"
                    id="progressFill">
                </div>

            </div>


            <div class="stats">

                <div>
                    <div
                        class="stat-number"
                        id="completed">
                        0
                    </div>

                    <div class="label">
                        Completed
                    </div>
                </div>


                <div>
                    <div
                        class="stat-number"
                        id="remaining">
                        0
                    </div>

                    <div class="label">
                        Remaining
                    </div>
                </div>

            </div>

        </div>


        <div class="card">

            <div class="label">
                Current Milestone
            </div>

            <div
                class="current-task"
                id="currentTask">
                Loading...
            </div>

            <p
                class="task-detail"
                id="currentDetail">
            </p>

        </div>

    </div>


    <div
        class="card"
        style="margin-top:20px">

        <div class="label">
            Development Roadmap
        </div>

        <div
            class="task-list"
            id="taskList">
        </div>

    </div>

</div>


<script>

async function loadProgress() {

    const response =
        await fetch("./progress.json");

    const tasks =
        await response.json();


    const completed =
        tasks.filter(
            task => task.status === "done"
        ).length;


    const percentage =
        Math.round(
            (completed / tasks.length) * 100
        );


    document
        .getElementById("percentage")
        .textContent =
        percentage + "%";


    document
        .getElementById("progressFill")
        .style.width =
        percentage + "%";


    document
        .getElementById("completed")
        .textContent =
        completed;


    document
        .getElementById("remaining")
        .textContent =
        tasks.length - completed;


    const current =
        tasks.find(
            task => task.status === "active"
        );


    if (current) {

        document
            .getElementById("currentTask")
            .textContent =
            current.name;


        document
            .getElementById("currentDetail")
            .textContent =
            current.detail;

    }


    const taskList =
        document.getElementById("taskList");


    tasks.forEach(task => {

        const element =
            document.createElement("div");


        element.className =
            "task " + task.status;


        element.innerHTML = `

            <div class="dot"></div>

            <div class="task-name">

                ${task.name}

                <div class="task-detail">
                    ${task.detail}
                </div>

            </div>

            <div class="status">
                ${task.status}
            </div>

        `;


        taskList.appendChild(element);

    });

}


loadProgress();

</script>


</body>
</html>
